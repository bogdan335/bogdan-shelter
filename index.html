<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shelter">
<meta name="theme-color" content="#1b2215">
<title>Shelter by Bulatnikov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#c5c9ad; --bg-deep:#adb391; --panel:#dcdec9; --panel-2:#cfd2b8; --paper:#fbf6e9; --paper-2:#efe7d2; --paper-edge:#d3c6a3;
  --on-bg:#1f2419; --on-bg-muted:#4c5240; --ink:#1f2419; --ink-muted:#625e4b;
  --stamp:#c42a1f; --stamp-ink:#fff6ea; --ok:#4c7a26; --ok-ink:#f4f8ea;
  --redact:#1f2419; --display:#20261a; --display-ink:#ffb347;
  --line:#1f2419; --overlay:rgba(18,22,14,.62);
  --t-bio:#dce7ec; --d-bio:#33637f;
  --t-health:#f2ddd8; --d-health:#a23e3a;
  --t-hobby:#f4e6c6; --d-hobby:#8a6214;
  --t-phobia:#e5e0ee; --d-phobia:#5c4d82;
  --t-char:#d8eae3; --d-char:#2f7365;
  --t-habit:#f3decf; --d-habit:#9a4f2a;
  --t-know:#eedde8; --d-know:#7c4170;
  --t-bag:#e2ead2; --d-bag:#4d6a2c;
  --t-act:#f7ecc4; --d-act:#7d6000;
  --ic-red:#e2574c; --ic-pink:#f3a3b6; --ic-yellow:#f6c445; --ic-orange:#ee8a3a; --ic-blue:#5b9bd6;
  --ic-teal:#4bb3a0; --ic-violet:#9a7fd2; --ic-green:#7cb44a; --ic-brown:#b07440; --ic-tan:#e9c48f;
  --ic-cream:#fff1d2; --ic-white:#fffaf0; --ic-steel:#a7b6c0;
  --f-ui:"PT Sans Narrow","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --f-body:"Rubik","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2215; --bg-deep:#11160c; --panel:#29321f; --panel-2:#323c27; --paper:#ddd5bd; --paper-2:#c9bfa3; --paper-edge:#a89c7c;
    --on-bg:#e6e1cd; --on-bg-muted:#a6a891; --ink:#1d2117; --ink-muted:#504c3b;
    --stamp:#d43a2c; --stamp-ink:#fff4e6; --ok:#5f8f33; --ok-ink:#f2f7e8;
    --redact:#1d2117; --display:#0e120a; --display-ink:#ffb347;
    --line:#0b0e08; --overlay:rgba(5,7,3,.74);
    --t-bio:#c3cfd2; --t-health:#dbc4be; --t-hobby:#dccda9; --t-phobia:#ccc7d4; --t-char:#bfd1c9;
    --t-habit:#dac4b4; --t-know:#d4c3cd; --t-bag:#c8d0b6; --t-act:#ddd2a6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2215; --bg-deep:#11160c; --panel:#29321f; --panel-2:#323c27; --paper:#ddd5bd; --paper-2:#c9bfa3; --paper-edge:#a89c7c;
  --on-bg:#e6e1cd; --on-bg-muted:#a6a891; --ink:#1d2117; --ink-muted:#504c3b;
  --stamp:#d43a2c; --stamp-ink:#fff4e6; --ok:#5f8f33; --ok-ink:#f2f7e8;
  --redact:#1d2117; --display:#0e120a; --display-ink:#ffb347;
  --line:#0b0e08; --overlay:rgba(5,7,3,.74);
  --t-bio:#c3cfd2; --t-health:#dbc4be; --t-hobby:#dccda9; --t-phobia:#ccc7d4; --t-char:#bfd1c9;
  --t-habit:#dac4b4; --t-know:#d4c3cd; --t-bag:#c8d0b6; --t-act:#ddd2a6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);background-image:radial-gradient(130% 90% at 50% 0%,transparent 55%,var(--bg-deep));color:var(--on-bg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--display-ink);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
#view{position:absolute;inset:0}
#layer{position:absolute;inset:0;pointer-events:none;z-index:60}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 14px 12px}
.grow{flex:1}

/* stickers */
.ol{stroke:var(--line);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.olt{stroke:var(--line);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fr{fill:var(--ic-red)} .fp{fill:var(--ic-pink)} .fy{fill:var(--ic-yellow)} .fo{fill:var(--ic-orange)} .fb{fill:var(--ic-blue)}
.ft{fill:var(--ic-teal)} .fv{fill:var(--ic-violet)} .fg{fill:var(--ic-green)} .fbr{fill:var(--ic-brown)} .ftan{fill:var(--ic-tan)}
.fc{fill:var(--ic-cream)} .fw{fill:var(--ic-white)} .fs{fill:var(--ic-steel)} .fk{fill:var(--line)} .fn{fill:none}
.hl{stroke:var(--ic-white);stroke-width:2.2;fill:none;stroke-linecap:round;opacity:.9}
.sticker{filter:drop-shadow(1.6px 0 0 var(--ic-white)) drop-shadow(-1.6px 0 0 var(--ic-white)) drop-shadow(0 1.6px 0 var(--ic-white)) drop-shadow(0 -1.6px 0 var(--ic-white))}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;font:700 22px/1 var(--f-ui);color:var(--on-bg);background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn svg{width:34px;height:34px;flex:0 0 34px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn-primary{background:var(--stamp);color:var(--stamp-ink)}
.btn-big{font-size:30px;padding:18px 16px}
.btn-big svg{width:44px;height:44px;flex-basis:44px}
.btn-block{width:100%}
.btn-small{font-size:18px;padding:10px 16px;box-shadow:0 3px 0 var(--line);margin:4px auto 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icon-btn{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--line);border-radius:12px;background:var(--panel);color:var(--on-bg);font:700 24px/1 var(--f-ui);box-shadow:0 4px 0 var(--line)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* menu */
.logo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-1deg)}
.logo.stamp-in{animation:stampIn .65s cubic-bezier(.2,.9,.3,1.2) both}
.logo-mark{width:96px;height:96px}
.logo-word{font:700 clamp(56px,20vw,96px)/.9 var(--f-ui);letter-spacing:.03em;margin:16px 0 0;color:var(--on-bg);-webkit-mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 53%,#000 53%);mask-image:linear-gradient(180deg,#000 0 46%,transparent 46% 53%,#000 53%)}
.logo-by{margin:12px 0 0;padding-top:8px;border-top:3px solid var(--stamp);font:500 19px var(--f-body);color:var(--on-bg-muted)}
.menu-actions{display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.foot{text-align:center;font:400 14px var(--f-body);color:var(--on-bg-muted);margin:6px 0 0}

/* subscreens */
.bar{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.bar h2{font:700 34px/1 var(--f-ui);margin:0}
.sheet{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 0 var(--line)}
.sheet+.sheet{margin-top:14px}
.sheet.center{text-align:center}
.sheet-title{font:700 22px var(--f-ui)}
.hint{font:400 15px/1.4 var(--f-body);color:var(--ink-muted);margin:8px 0 0}
.count-row{display:flex;align-items:center;justify-content:center;gap:24px;margin:8px 0 4px}
.count{font:600 60px/1 var(--f-body);min-width:2ch;text-align:center}
.round-btn{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--t-hobby);color:var(--ink);font:700 28px/1 var(--f-ui);box-shadow:0 3px 0 var(--line)}
input[type=range]{width:100%;accent-color:var(--stamp);margin-top:8px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;background:var(--paper-2);color:var(--ink);border:2px solid var(--paper-edge);border-radius:12px;padding:10px 12px}
.set.on{border-color:var(--line)}
.set.on[data-k="base"]{background:var(--t-bag)} .set.on[data-k="absurd"]{background:var(--t-habit)} .set.on[data-k="school"]{background:var(--t-bio)}
.set b{display:block;font:700 19px var(--f-ui)}
.set small{display:block;font:400 14px/1.3 var(--f-body);color:var(--ink-muted)}
.set-check{width:26px;height:26px;border:2.5px solid var(--line);border-radius:7px;display:grid;place-items:center;font:700 17px/1 var(--f-ui);background:var(--paper)}
.set.on .set-check{background:var(--stamp);color:var(--stamp-ink)}
.code{display:flex;justify-content:center;gap:10px;margin:8px 0 10px}
.tile-c{width:64px;height:78px;display:grid;place-items:center;font:600 44px/1 var(--f-body);background:var(--display);color:var(--display-ink);border:3px solid var(--line);border-radius:12px;text-transform:uppercase;text-align:center;padding:0}
.tile-c.set-in{animation:thudSmall .25s ease-out}
input.tile-c{outline:none;caret-color:var(--display-ink)}
input.tile-c:focus{box-shadow:0 0 0 3px var(--stamp)}
.wheel-wrap{position:relative;margin:12px -16px 0;height:88px}
.wheel-wrap::after{content:"";position:absolute;left:50%;top:8px;width:72px;height:72px;transform:translateX(-50%);border:3px solid var(--line);border-radius:14px;background:var(--t-hobby);z-index:0;pointer-events:none}
.wheel{position:relative;z-index:1;display:flex;height:88px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-x;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 26%,#000 74%,transparent);mask-image:linear-gradient(90deg,transparent,#000 26%,#000 74%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel::before,.wheel::after{content:"";flex:0 0 calc(50% - 36px)}
.w-item{flex:0 0 72px;height:88px;display:grid;place-items:center;scroll-snap-align:center;font:600 34px/1 var(--f-body);color:var(--ink-muted);background:none;border:none;padding:0;transition:color .15s,font-size .15s}
.w-item svg{width:40px;height:40px;opacity:.6;transition:opacity .15s}
.w-item.sel{color:var(--ink);font-size:42px}
.w-item.sel svg{opacity:1}

/* game: carousel of dossiers */
.screen.game{padding-top:8px}
.carousel{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;padding:0 14px;display:flex;flex-direction:column}
.dossier{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--paper-2);color:var(--ink);border:3px solid var(--line);border-radius:18px;position:relative;overflow:hidden}
.dhead{background:var(--paper);border-bottom:3px solid var(--line);padding:10px 12px 10px 14px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;font:700 17px/1 var(--f-ui);background:var(--display);color:var(--display-ink);border-radius:8px;padding:6px 10px}
.pchip em{font-style:normal;font:600 12px/1 var(--f-body);background:var(--stamp);color:var(--stamp-ink);border-radius:5px;padding:3px 6px}
.kick{font:700 17px/1 var(--f-ui);border:2.5px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--stamp);color:var(--stamp-ink);box-shadow:0 3px 0 var(--line)}
.kick.back{background:var(--ok);color:var(--ok-ink)}
.kick:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.prof{font:700 31px/1.05 var(--f-ui);margin:8px 0 0}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mark{font:600 13px/1 var(--f-body);background:var(--t-health);color:var(--d-health);border:2px solid var(--d-health);border-radius:999px;padding:4px 10px}
.ability{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:700 16px/1 var(--f-ui);border:2.5px solid var(--line);background:var(--t-act);color:var(--ink);border-radius:10px;padding:6px 10px 6px 6px;box-shadow:0 2px 0 var(--line)}
.ability svg{width:24px;height:24px}
.ability:disabled{opacity:.55;box-shadow:none}
.dbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 12px 16px}
.selfnote{display:flex;align-items:center;gap:8px;font:500 13px/1.3 var(--f-body);color:var(--ink-muted);margin:2px 2px 0}
.selfnote svg{width:20px;height:20px;flex:0 0 20px}
.rlabel{font:700 17px/1 var(--f-ui);color:var(--d);margin:14px 4px 6px}
.crow{--t:var(--paper);--d:var(--ink);display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:12px;background:var(--t);border:2.5px solid var(--line);border-radius:14px;padding:9px 12px;min-height:66px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 3px 0 var(--line)}
.ricon svg{width:44px;height:44px;display:block}
.rval{font:600 18px/1.3 var(--f-body);color:var(--ink);position:relative;word-break:break-word}
.crow.locked{border-style:dashed;box-shadow:none}
.lockmark{width:22px;height:22px}
.lockmark svg{width:22px;height:22px;display:block}
.fill{position:absolute;inset:0;background:var(--d);opacity:.18;transform-origin:left;transform:scaleX(0);pointer-events:none}
.crow.holding .fill{transform:scaleX(1);transition:transform .75s linear}
.redact{display:block;height:18px;background:var(--redact);border-radius:3px}
.peel{position:absolute;inset:-2px -3px;background:var(--redact);border-radius:3px;transform-origin:right center;animation:peel .6s cubic-bezier(.7,0,.3,1) forwards}
.minstamp{position:absolute;right:10px;top:50%;font:700 15px/1 var(--f-ui);color:var(--stamp);border:2.5px solid var(--stamp);background:var(--ic-white);padding:3px 7px;border-radius:5px;transform:translateY(-50%) rotate(-8deg);animation:minstamp 1.5s forwards;pointer-events:none}
.crow.shake{animation:shake .35s}
.qhint{margin-left:6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--d);background:var(--ic-white);color:var(--d);font:700 14px/1 var(--f-ui);vertical-align:2px;padding:0}
.hinttext{display:none;margin-top:6px;font:500 14px/1.3 var(--f-body);color:var(--ink);background:var(--ic-white);border:1.5px solid var(--d);padding:6px 8px;border-radius:8px}
.crow.show-hint .hinttext{display:block}
.small{font:500 13px var(--f-body);color:var(--ink-muted);margin:4px 0 0}
.mini-btn{font:700 16px/1 var(--f-ui);border:2.5px solid var(--line);background:var(--ic-yellow);color:var(--ink);border-radius:10px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.stamp-kicked{position:absolute;top:58px;right:14px;font:700 34px/1 var(--f-ui);color:var(--stamp);border:4px solid var(--stamp);padding:4px 12px;border-radius:7px;transform:rotate(-12deg);display:none;pointer-events:none;letter-spacing:.06em;background:var(--paper);z-index:3}
.kicked .stamp-kicked{display:block}
.kicked .stamp-kicked.thud{animation:thud .35s ease-out}
.kicked .dbody,.kicked .prof{opacity:.5;filter:grayscale(.5)}

/* player tabs hanging under the dossier, driven by the carousel */
.tabs-wrap{position:relative;margin-top:-3px;z-index:2;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.tabs{display:flex;gap:6px;overflow:hidden;height:64px;align-items:flex-start}
.tabs::before,.tabs::after{content:"";flex:0 0 calc(50% - 36px)}
.ptab{flex:0 0 60px;height:50px;background:var(--panel-2);color:var(--on-bg);border:3px solid var(--line);border-radius:0 0 14px 14px;font:600 23px/1 var(--f-body);position:relative;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:height .15s,background .15s}
.ptab small{font:600 10px/1 var(--f-body);color:var(--stamp)}
.ptab.sel{height:60px;background:var(--paper-2);color:var(--ink);border-top-color:var(--paper-2)}
.ptab.kicked{color:var(--stamp);text-decoration:line-through}
.ptab.dot::after{content:"";position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--stamp);border:2px solid var(--ic-white);animation:pulse 1.2s infinite}

/* toolbar */
.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:5px;box-shadow:0 4px 0 var(--line);margin-top:2px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;border-radius:12px;padding:6px 0 5px;color:var(--on-bg);font:700 15px/1 var(--f-ui)}
.tbtn svg{width:36px;height:36px}
.tbtn:active{background:var(--panel-2)}
.tbtn.ping svg{animation:wiggle .6s ease-in-out 3}

/* drawer */
.scrim{position:absolute;inset:0;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s;z-index:39}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:90%;background:var(--paper-2);color:var(--ink);border-right:3px solid var(--line);transform:translateX(-104%);transition:transform .3s cubic-bezier(.3,.8,.3,1);z-index:40;overflow-y:auto;padding:14px 14px 20px}
.drawer.open{transform:none}
.drawer.dragging,.scrim.dragging{transition:none}

.doc-head{display:flex;align-items:center;gap:10px;font:700 26px/1.1 var(--f-ui);padding-bottom:12px;border-bottom:3px solid var(--line)}
.doc-head svg{width:40px;height:40px;flex:0 0 40px}
.dcard{background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;box-shadow:0 3px 0 var(--line)}
.dcard h4{font:700 22px/1.1 var(--f-ui);margin:0 0 8px}
.dcard.cat{background:var(--t-health)}
.typed{font:500 16px/1.45 var(--f-body);margin:0}
details summary{font:700 16px var(--f-ui);margin-top:8px;color:var(--d-health)}
details .typed{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat:nth-child(1){background:var(--t-bio)} .stat:nth-child(2){background:var(--t-char)} .stat:nth-child(3){background:var(--t-hobby)}
.stat b{display:block;font:700 21px/1.1 var(--f-ui)}
.stat span{font:500 12px var(--f-body);color:var(--ink-muted)}
.room{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px;border-radius:12px;border:2px solid var(--line);margin-top:8px;background:var(--t-bag)}
.room svg{width:36px;height:36px}
.room b{display:block;font:700 18px/1.1 var(--f-ui)}
.room span{display:block;font:500 14px/1.3 var(--f-body)}
.room.locked{background:var(--paper);border-style:dashed}
.room.locked span{color:var(--ink-muted)}
.round-now{font:700 17px var(--f-ui);margin:14px 0 4px}

/* toasts & modals */
#toasts{position:absolute;top:8px;left:10px;right:10px;z-index:90;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#toasts.low{top:auto;bottom:168px}
.toast{background:var(--paper);color:var(--ink);border:2.5px solid var(--line);border-radius:12px;padding:9px 12px;font:500 14px/1.35 var(--f-body);box-shadow:0 4px 0 var(--line);animation:toastIn .25s ease-out}
.toast b{font:700 16px var(--f-ui);margin-right:6px}
.toast.out{animation:toastOut .3s forwards}
.modal-wrap{position:absolute;inset:0;z-index:95;display:grid;place-items:center;padding:14px;background:var(--overlay);pointer-events:auto;animation:fade .2s ease-out;transition:opacity .2s}

const TRAITS = ['bio', 'health', 'hobby', 'phobia', 'char', 'habit', 'know', 'bag'];
const LABELS = { bio: 'Биология', prof: 'Профессия', health: 'Здоровье', hobby: 'Хобби', phobia: 'Фобия', char: 'Характер', habit: 'Привычка', know: 'Знание', bag: 'Багаж' };
const NEED_NAMES = { water: 'Вода', food: 'Еда', power: 'Энергия', med: 'Здоровье', order: 'Порядок', defense: 'Оборона', comms: 'Связь', cold: 'Тепло' };

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function parseTags(s) {
  const tags = {};
  (s || '').split(',').map(x => x.trim()).filter(Boolean).forEach(x => {
    const [k, v] = x.split(':');
    tags[k] = v === undefined ? 1 : parseFloat(v);
  });
  return tags;
}
function parseDeck(str, k) {
  return str.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [t, tg, extra] = line.split('|');
    const c = { k, t, tags: parseTags(tg) };
    if (extra) { if (k === 'habit') c.l = extra; else c.h = extra; }
    return c;
  });
}
const POOLS = {};
['prof', 'hobby', 'health', 'phobia', 'char', 'habit', 'know', 'bag'].forEach(k => { POOLS[k] = parseDeck(D[k], k); });

/* gender helper */
function G(text, sex) {
  if (!text) return '';
  const f = sex === 'f';
  return text.replace(/\{([^}]*)\}/g, (_, inner) => {
    if (inner.includes('/')) { const [m, w] = inner.split('/'); return f ? w : m; }
    switch (inner) {
      case 'а': return f ? 'а' : '';
      case 'ла': return f ? 'ла' : '';
      case 'его': return f ? 'её' : 'его';
      case 'нём': return f ? 'ней' : 'нём';
      case 'ним': return f ? 'ней' : 'ним';
      case 'он': return f ? 'она' : 'он';
      default: return inner;
    }
  });
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function yearsText(y) {
  if (y === 0.25) return '3 месяца';
  if (y === 0.5) return 'полгода';
  if (y === 0.75) return '9 месяцев';
  if (y === 1.5) return 'полтора года';
  if (y === 2.5) return 'два с половиной года';
  if (Number.isInteger(y)) return `${y} ${plural(y, 'год', 'года', 'лет')}`;
  const m = Math.round(y * 12);
  return `${m} ${plural(m, 'месяц', 'месяца', 'месяцев')}`;
}

/* bio */
function bioText(b) {
  const sexW = b.sex === 'm' ? 'Мужчина' : 'Женщина';
  const or = { het: 'гетеро', gay: b.sex === 'm' ? 'гей' : 'лесбиянка', bi: 'би', ace: b.sex === 'm' ? 'асексуал' : 'асексуалка' }[b.orient];
  let s = `${sexW}, ${b.age} ${plural(b.age, 'год', 'года', 'лет')}, ${or}`;
  if (b.preg) s += `, беременна (${b.preg}-й месяц)`;
  return s;
}
function makeBio() {
  const sex = Math.random() < 0.5 ? 'm' : 'f';
  const r = Math.random();
  const age = r < 0.62 ? 18 + rnd(27) : r < 0.88 ? 45 + rnd(20) : 65 + rnd(26);
  const o = Math.random();
  const orient = o < 0.7 ? 'het' : o < 0.82 ? 'gay' : o < 0.94 ? 'bi' : 'ace';
  const b = { k: 'bio', sex, age, orient, tags: {} };
  if (sex === 'f' && age <= 42 && orient !== 'ace' && Math.random() < 0.12) b.preg = 2 + rnd(7);
  b.t = bioText(b);
  return b;
}
function setAge(b, age) { b.age = clamp(Math.round(age), 18, 99); if (b.preg && b.age > 46) delete b.preg; b.t = bioText(b); }

/* ---------- new game ---------- */
function roundsFor(n) { return n >= 10 ? 5 : 4; }
function roundTable(n, seats) {
  const R = roundsFor(n), kicks = n - seats, out = [];
  const base = Math.floor(kicks / R), extra = kicks - base * R;
  const reveals = R === 5 ? [2, 2, 2, 1, 1] : [2, 2, 2, 2];
  for (let i = 0; i < R; i++) out.push({ r: i + 1, open: reveals[i], kick: base + (i >= R - extra ? 1 : 0) });
  return out;
}

function newGame(code, n, opts = {}) {
  return {
    v: DECK_VERSION, code, n, phase: 'lobby', created: Date.now(),
    absurd: opts.absurd !== false,
    players: {}, seen: [], toast: null, evSeq: 0, event: null, ending: null
  };
}

function dealActions(seatList) {
  const n = seatList.length;
  const strongN = clamp(1 + rnd(3), 1, n >= 8 ? 3 : 2);
  const medN = Math.round(0.35 * n);
  const fam = {}, chosen = [];
  const tryAdd = c => {
    if ((fam[c.f] || 0) >= 2 || chosen.includes(c)) return false;
    fam[c.f] = (fam[c.f] || 0) + 1; chosen.push(c); return true;
  };
  const imba = Math.random() < 0.5 ? 1 : 0;
  const pools = { imba: shuffle(ACTIONS.filter(a => a.t === 4)), strong: shuffle(ACTIONS.filter(a => a.t === 3)), med: shuffle(ACTIONS.filter(a => a.t === 2)), small: shuffle(ACTIONS.filter(a => a.t === 1)) };
  let s = 0;
  if (imba) { tryAdd(pools.imba[0]); s++; }
  for (const c of pools.strong) { if (s >= strongN) break; if (tryAdd(c)) s++; }
  let m = 0;
  for (const c of pools.med) { if (m >= medN) break; if (tryAdd(c)) m++; }
  for (const c of pools.small) { if (chosen.length >= n) break; tryAdd(c); }
  for (const c of shuffle(ACTIONS.filter(a => a.t <= 2))) { if (chosen.length >= n) break; if (!chosen.includes(c)) chosen.push(c); }
  return shuffle(chosen).map(c => ACTIONS.indexOf(c));
}
function dealConds(n) {
  const out = [];
  const add = list => { for (const c of shuffle(list)) { if (!out.includes(c)) { out.push(c); return; } } };
  if (Math.random() < 0.5) add(CONDS.filter(c => c.t === 3));
  const neg = Math.round(n * 0.3), med = Math.round(n * 0.3);
  for (let i = 0; i < neg && out.length < n; i++) add(CONDS.filter(c => c.t === -1));
  for (let i = 0; i < med && out.length < n; i++) add(CONDS.filter(c => c.t === 2));
  while (out.length < n) add(CONDS.filter(c => c.t === 1 || c.t === 2));
  return shuffle(out).map(c => CONDS.indexOf(c));
}

function startGame(st) {
  const seats = Object.keys(st.players).map(Number).filter(s => st.players[s].joined).sort((a, b) => a - b);
  st.active = seats;
  const n = seats.length;
  st.seatsInBunker = Math.max(1, Math.floor(n / 2));
  st.table = roundTable(n, st.seatsInBunker);
  st.R = st.table.length;
  st.round = 1;
  /* catastrophe & bunker */
  const cat = st.absurd ? rnd(CATS.length) : pick(CATS.map((c, i) => i).filter(i => !CATS[i].a));
  st.cat = cat;
  const years = pick([0.5, 1, 1, 1.5, 2, 2, 3]);
  const supplies = pick([0.25, 0.5, 0.5, 1, 1, 1.5, 2, 3]);
  const rooms = shuffle(ROOMS).slice(0, 4).map(r => ({ ...r, ok: Math.random() < 0.45 }));
  if (rooms.every(r => r.ok)) rooms[rnd(4)].ok = false;
  if (rooms.every(r => !r.ok)) rooms[rnd(4)].ok = true;
  rooms.forEach((r, i) => { r.r = i < 2 ? 1 : i === 2 ? 2 : 3; });
  const sur = { ...pick(SURPRISE_ROOMS), r: st.R, surprise: true };
  st.bunker = { type: pick(BUNKER_TYPES), years, supplies, area: 80 + rnd(30) * 10, rooms, surprise: sur };
  st.hints = makeHints(st);
  /* cards */
  const pools = {};
  Object.keys(POOLS).forEach(k => { pools[k] = shuffle(POOLS[k]); });
  const acts = dealActions(seats), conds = dealConds(n);
  st.chars = {}; st.rev = {}; st.marks = {}; st.actUsed = {}; st.condRev = {}; st.condUsed = {};
  seats.forEach((s, i) => {
    const c = { bio: makeBio() };
    ['prof', 'health', 'hobby', 'phobia', 'char', 'habit', 'know', 'bag'].forEach(k => { c[k] = { ...pools[k].pop() }; });
    c.act = acts[i]; c.cond = conds[i];
    st.chars[s] = c; st.rev[s] = []; st.marks[s] = [];
  });
  st.kicked = []; st.banners = []; st.bonus = {}; st.nextEvent = {}; st.usedEvents = []; st.twistUsed = false;
  st.pending = {}; st.priv = {}; st.extraSeats = 0; st.condLog = [];
  const immune = seats.filter(s => st.players[s].immune);
  st.peeRound = immune.length && Math.random() < 0.45 ? 3 + rnd(Math.max(1, st.R - 2)) : 0;
  st.phase = 'play';
  st.introSeq = (st.introSeq || 0) + 1;
  say(st, `Игра началась. ${CATS[cat].name}.`);
}

function activeNeeds(st) {
  const b = st.bunker, needs = new Set(['med', 'order']);
  const roomFor = need => b.rooms.filter(r => r.need === need);
  const okFor = need => roomFor(need).some(r => r.ok && !r.never);
  if (!okFor('water')) needs.add('water');
  if (!okFor('power')) needs.add('power');
  if (b.supplies < b.years) needs.add('food');
  if (['zombie', 'animals', 'insects'].includes(CATS[st.cat].id) || st.bonus.defenseNeed) needs.add('defense');
  if (CATS[st.cat].id === 'ice' || roomFor('cold').some(r => !r.ok)) needs.add('cold');
  needs.add('comms');
  return needs;
}
function makeHints(st) {
  const b = st.bunker, h = [];
  if (b.supplies < b.years) h.push(`Запасов на ${yearsText(b.supplies)}. Сидеть — ${yearsText(b.years)}.`);
  else h.push(`Сидеть — ${yearsText(b.years)}. Запасов вроде бы хватает.`);
  const water = b.rooms.find(r => r.need === 'water'), power = b.rooms.find(r => r.need === 'power');
  if (!water || !water.ok) h.push(pick(['Вода из крана пахнет ржавчиной.', 'Говорят, с водой тут проблемы.']));
  else if (!power || !power.ok) h.push(pick(['Генератор чихает и глохнет.', 'Свет мигает уже с порога.']));
  else h.push('Аптечка в бункере почти пустая.');
  h.push(CATS[st.cat].hint);
  return h;
}

/* ---------- helpers on state ---------- */
const alive = st => (st.active || []).filter(s => !st.kicked.includes(s));
function say(st, text) { st.toast = { seq: (st.toast ? st.toast.seq : 0) + 1, text }; }
function revealCat(st, s, k) { if (k === 'prof') return; if (!st.rev[s].includes(k)) st.rev[s].push(k); }
function card(st, s, k) { return st.chars[s][k]; }
function sexOf(st, s) { return st.chars[s].bio.sex; }
function who(st, s) { return `№${s} ${st.chars[s].prof.t}`; }
function priv(st, s, title, text) { (st.priv[s] = st.priv[s] || []).push({ id: Date.now() + '' + rnd(1e6), title, text }); }
function randomFrom(k, exclude) {
  const pool = POOLS[k].filter(c => c.t !== (exclude && exclude.t));
  return { ...pick(pool) };
}
function nonHealthy() { return { ...pick(POOLS.health.filter(c => !c.tags.healthy)) }; }
function healthy() { return { ...POOLS.health.find(c => c.tags.healthy) }; }
function mergeCards(a, b) {
  const tags = { ...a.tags };
  Object.entries(b.tags || {}).forEach(([k, v]) => { tags[k] = (tags[k] || 0) + v; });
  return { k: a.k, t: `${a.t} + ${b.t}`, tags };
}
const NOTHING = k => ({ k, t: k === 'bag' ? 'Ничего' : 'Нет', tags: {} });

/* ---------- action cards ---------- */
function applyAction(st, a, it) {
  const card = ACTIONS[st.chars[a].act];
  if (!card || st.actUsed[a] || st.kicked.includes(a)) return;
  const b = it.target, c2 = it.target2, cat = it.cat;
  const C = s => st.chars[s];
  const swap = (x, y, k) => { const t = C(x)[k]; C(x)[k] = C(y)[k]; C(y)[k] = t; revealCat(st, x, k); revealCat(st, y, k); };
  let note = '';
  switch (card.e) {
    case 'ageSelf': setAge(C(a).bio, C(a).bio.age + card.p); note = `№${a} ${card.p < 0 ? 'помолодел' : 'постарел'} на ${Math.abs(card.p)} лет.`; break;
    case 'ageOther': setAge(C(b).bio, C(b).bio.age + card.p); note = `№${b} постарел на ${card.p} лет.`; break;
    case 'ageSwap': { const x = C(a).bio.age; setAge(C(a).bio, C(b).bio.age); setAge(C(b).bio, x); revealCat(st, a, 'bio'); revealCat(st, b, 'bio'); note = `№${a} и №${b} поменялись возрастом.`; break; }
    case 'ageTransfer': setAge(C(b).bio, C(b).bio.age + card.p); setAge(C(a).bio, C(a).bio.age - card.p); note = `№${b} постарел на ${card.p}, №${a} помолодел на ${card.p}.`; break;
    case 'ageRandom': setAge(C(a).bio, 18 + rnd(63)); revealCat(st, a, 'bio'); note = `Новый возраст №${a}: ${C(a).bio.age}.`; break;
    case 'ageSwapOthers': { const x = C(b).bio.age; setAge(C(b).bio, C(c2).bio.age); setAge(C(c2).bio, x); revealCat(st, b, 'bio'); revealCat(st, c2, 'bio'); note = `№${b} и №${c2} поменялись возрастом.`; break; }
    case 'healSelf': C(a).health = healthy(); revealCat(st, a, 'health'); note = `№${a} теперь здоров.`; break;
    case 'healOther': C(b).health = healthy(); revealCat(st, b, 'health'); note = `№${b} теперь здоров.`; break;
    case 'infect': C(b).health = nonHealthy(); revealCat(st, b, 'health'); note = `№${b} заболел.`; break;
    case 'swapCat': swap(a, b, card.p); note = `№${a} и №${b} поменялись: ${LABELS[card.p].toLowerCase()}.`; break;
    case 'swapOthers': swap(b, c2, card.p); note = `№${b} и №${c2} поменялись: ${LABELS[card.p].toLowerCase()}.`; break;
    case 'reroll': C(a)[card.p] = randomFrom(card.p, C(a)[card.p]); revealCat(st, a, card.p); note = `У №${a} новая карта: ${LABELS[card.p].toLowerCase()}.`; break;
    case 'rerollOther': C(b)[card.p] = randomFrom(card.p, C(b)[card.p]); revealCat(st, b, card.p); note = `У №${b} новая карта: ${LABELS[card.p].toLowerCase()}.`; break;
    case 'fire': C(b).prof = { k: 'prof', t: 'Безработный', tags: {} }; note = `№${b} теперь безработный.`; break;
    case 'steal': C(a).bag = C(a).bag.t === 'Ничего' ? C(b).bag : mergeCards(C(a).bag, C(b).bag); C(b).bag = NOTHING('bag'); revealCat(st, a, 'bag'); revealCat(st, b, 'bag'); note = `№${a} забрал багаж №${b}.`; break;

/* ---------- capability of a person ---------- */
function profile(st, s) {
  const c = st.chars[s], sk = {}, fl = {};

    Object.entries(c[k].tags || {}).forEach(([t, v]) => {

    });
  });

  if (sk.drunk) mul *= 0.5;
  (st.marks[s] || []).forEach(m => { mul *= m === 'Травма' ? 0.75 : 0.92; });

  sk.youth = age < 40 ? 1 : 0;
  if (c.bio.preg) sk.weak = (sk.weak || 0) + 0.5;

}

}

    const w = (c[k].tags || {})[need] || 0;
    if (w > v) { v = w; best = c[k]; }
  });
  return best;
}

/* ---------- events ---------- */
function startRound(st) {
  if (st.round >= st.R) return;
  st.round += 1;
  const room = [...st.bunker.rooms, st.bunker.surprise].find(r => r.r === st.round && !r.never);
  if (room) {
    if (room.surprise) applySurprise(st, room);
    say(st, `Раунд ${st.round}. В бункере открыли: ${room.n}. ${room.surprise ? room.text : room.ok ? room.ok : room.bad}.`);
  } else say(st, `Раунд ${st.round}.`);

}
function applySurprise(st, r) {
  if (r.applied) return; r.applied = true;
  if (r.fx === 'food') st.bunker.supplies += 1;
  if (r.fx === 'med') st.bonus.med = (st.bonus.med || 0) + 1.5;
  if (r.fx === 'power') st.bonus.power = (st.bonus.power || 0) + 1.5;
  if (r.fx === 'lostfood') st.bunker.supplies = Math.max(0.25, st.bunker.supplies - 0.5);

}

    st.condUsed[t] = true; st.condRev[t] = true;
    const others = al.filter(x => x !== t);
    if (others.length) { const nt = others.find(x => x > t) || others[0]; st.condLog.push(`№${t} «Везунчик»: событие ушло к №${nt}`); t = nt; }
  }

}

    let pool = EVENTS.map((e, i) => i).filter(i => EVENTS[i].tone === tone && !st.usedEvents.includes(i));
    if (!pool.length) pool = EVENTS.map((e, i) => i).filter(i => EVENTS[i].tone !== 'x' && !st.usedEvents.includes(i));
    if (!pool.length) pool = EVENTS.map((e, i) => i).filter(i => EVENTS[i].tone !== 'x');

    case 'supplies': st.bunker.supplies = Math.max(0.25, st.bunker.supplies + (ev.p || 0)); if (ev.gain) st.bonus[ev.gain] = (st.bonus[ev.gain] || 0) + 1; E.eff = fill(ev.eff); break;

    case 'reveal': revealCat(st, t, ev.cat); E.eff = fill(ev.eff); break;

  if (ok) {

    if (so.okFx === 'supplies') st.bunker.supplies += 0.25;
    if (so.okFx === 'fixPower') { const r = st.bunker.rooms.find(x => x.need === 'power'); if (r) r.ok = true; else st.bonus.power = (st.bonus.power || 0) + 1.5; }

}

  cold: ['было тепло', 'зиму пережили в свитерах']
};
const FAIL_LINES = {
  water: ['без чистой воды продержались {m}', 'вода кончилась на {mo}'],
  food: ['запасы кончились через {m}', 'есть стало нечего на {mo}'],
  power: ['генератор встал через {m}, а без вентиляции не выжить', 'свет погас на {mo} и больше не зажёгся'],
  med: ['лечить было некому'],
  order: ['к середине срока все перессорились'],
  defense: ['чужие прорвались внутрь'],
  comms: ['связи с внешним миром так и не было'],
  cold: ['зимой мёрзли так, что болели все']
};
const CRIT = ['water', 'food', 'power'];
const SECONDARY = { water: { smart: 0.4, hazmat: 0.4, build: 0.2 }, power: { build: 0.5, smart: 0.3 }, food: { animals: 0.4, swim: 0.3, scout: 0.3 }, med: { smart: 0.3 }, defense: { fight: 1, strong: 0.4 }, order: {}, comms: { smart: 0.3, power: 0.2 }, cold: { build: 0.3, animals: 0.2 } };
function skillFor(p, need) {
  let v = Math.max(0, p.sk[need] || 0);
  Object.entries(SECONDARY[need] || {}).forEach(([k, w]) => { v += w * Math.max(0, p.sk[k] || 0); });
  return v;
}

function computeEnding(st) {
  const rng = mulberry(hashStr(st.code + ':' + st.kicked.join(',') + ':' + st.round));
  const R = () => rng();
  const P = a => a[Math.floor(R() * a.length)];
  const al = alive(st);
  const profs = al.map(s => profile(st, s));
  const needs = activeNeeds(st);
  const bonus = { ...st.bonus };
  const b = st.bunker;
  let supplies = b.supplies;
  const condLines = [...(st.condLog || [])];
  let talisman = false, traitor = false, luck = 0;
  /* enter conditions */
  al.forEach(s => {
    const c = condOf(st, s);
    if (c.trig !== 'enter') return;
    const add = (k, v) => { bonus[k] = (bonus[k] || 0) + v; };
    switch (c.e) {
      case 'food2': supplies *= 2; break;
      case 'talisman': talisman = s; break;
      case 'defense': add('defense', 2); break;
      case 'med': add('med', 1.5); break;
      case 'seeds': add('food', 1.5); break;
      case 'workshop': b.rooms.filter(r => r.need === 'power').forEach(r => { r.ok = true; }); needs.delete('power'); break;
      case 'filter': add('water', 1); break;
      case 'batteries': add('power', 0.4); add('comms', 0.4); break;
      case 'socks': add('med', 0.5); break;
      case 'cat': add('order', 0.8); break;
      case 'luck': luck += 0.05; break;
      case 'kick': add('power', 1); break;
      case 'mouth': supplies = Math.max(0, supplies - 0.5); break;
      case 'debtor': needs.add('defense'); add('defense', -1); break;
      case 'loud': needs.add('defense'); add('defense', -1.5); break;
      case 'traitor': traitor = s; break;
      case 'cough': add('med', -1); break;
      case 'unluck': luck -= 0.05; break;
      case 'klepto': add('food', -1); break;
    }
    condLines.push(`№${s} «${c.n}»`);
  });
  if (supplies >= b.years) needs.delete('food');
  /* threats */
  const roles = {};
  const order = ['water', 'food', 'power', 'med', 'defense', 'cold', 'order', 'comms'].filter(n => needs.has(n));
  const results = [];
  order.forEach(need => {
    const cands = profs.map(p => ({ p, v: skillFor(p, need) * p.mul * Math.pow(0.8, roles[p.s] || 0) })).sort((x, y) => y.v - x.v);
    let S = (cands[0] ? cands[0].v : 0) + 0.5 * (cands[1] ? cands[1].v : 0) + (bonus[need] || 0);
    const room = b.rooms.find(r => r.need === need && r.ok && !r.never);
    if (room) S += 1.5;
    const sum = t => profs.reduce((a, p) => a + Math.max(0, p.sk[t] || 0), 0);
    if (need === 'food') S -= 0.6 * (sum('eater') + sum('thief')) + 1.2 * Math.max(0, (b.years - supplies) / b.years);
    if (need === 'water') S += Math.min(0, profs.reduce((a, p) => a + Math.min(0, p.sk.water || 0), 0));
    if (need === 'order') S -= 0.5 * sum('conflict');
    if (need === 'defense') S -= 0.7 * sum('noisy');
    if (need === 'med') S -= 0.15 * profs.filter(p => p.mul < 0.9).length;
    S += 0.06 * profs.length;
    const p = clamp(0.14 + 0.82 * (1 - Math.exp(-0.7 * Math.max(0, S))) + luck, 0.06, 0.97);
    const ok = R() < p;
    const top = cands[0] && cands[0].v > 0.3 ? cands[0].p : null;
    if (top && ok) roles[top.s] = (roles[top.s] || 0) + 1;
    results.push({ need, ok, top, crit: CRIT.includes(need) });
  });
  if (talisman) { const f = results.find(r => !r.ok && r.crit) || results.find(r => !r.ok); if (f) { f.ok = true; f.talisman = talisman; } }
  if (traitor) { const okList = results.filter(r => r.ok); if (okList.length) { const f = okList[Math.floor(R() * okList.length)]; f.ok = false; f.top = null; f.traitor = traitor; } }
  /* threat lines */
  const kickedProfs = st.kicked.map(s => profile(st, s));
  const threats = results.map(r => {
    let text;
    const months = 2 + Math.floor(R() * 8);
    if (r.ok) {
      const base = P(OK_LINES[r.need]).replace('{y}', yearsText(b.years));
      if (r.talisman) text = `Чудом: ${base}. Сработал талисман №${r.talisman}.`;
      else if (r.top) {
        const src = sourceCard(st, r.top.s, r.need);
        const sex = r.top.sex;
        text = `${who(st, r.top.s)}: ${base}.`;
        if (src && src.k !== 'prof') text += ` Выручило: «${G(src.t, sex)}».`;
        if (r.top.sk.drunk) text += G(' Правда, работал{а} через день: пил{а}.', sex);
      } else text = `Как-то справились: ${base}.`;
    } else {
      text = P(FAIL_LINES[r.need]).replace('{m}', `${months} ${plural(months, 'месяц', 'месяца', 'месяцев')}`).replace('{mo}', `${months}-й месяц`);
      text = text[0].toUpperCase() + text.slice(1) + '.';
      if (r.traitor) text += ` Не без помощи предателя №${r.traitor}.`;
      const shame = kickedProfs.filter(p => (p.sk[r.need] || 0) * p.mul >= 1.4).map(p => p.s);
      if (shame.length) text += shame.length === 1 ? ` Решение было рядом — ${who(st, shame[0])}, но этот номер вы выгнали.` : ` Решение было рядом — ${shame.map(s => '№' + s).join(' и ')}, но их вы выгнали.`;
    }
    return { name: NEED_NAMES[r.need], ok: r.need === 'comms' && !r.ok ? null : r.ok, text, need: r.need, crit: r.crit };
  });
  const critFails = results.filter(r => r.crit && !r.ok);
  const critFail = critFails.length >= 2 ? critFails[0] : null;
  const early = critFails.length === 1 ? critFails[0] : null;
  /* casualties from non-critical fails */
  const dead = new Set(), deadLines = [];
  if (!critFail) {
    const medFail = results.find(r => r.need === 'med' && !r.ok);
    if (medFail && profs.length > 1) {
      const frail = profs.slice().sort((x, y) => x.mul - y.mul || y.age - x.age)[0];
      if (frail.mul < 0.95 || frail.age > 60) { dead.add(frail.s); deadLines.push(G(`${who(st, frail.s)} не пережил{а} болезни.`, frail.sex)); }
    }
    const ordFail = results.find(r => r.need === 'order' && !r.ok);
    if (ordFail && profs.length > 1) {
      const angry = profs.filter(p => !dead.has(p.s)).sort((x, y) => (y.sk.conflict || 0) - (x.sk.conflict || 0))[0];
      if (angry && (angry.sk.conflict || 0) > 0) { dead.add(angry.s); deadLines.push(G(`${who(st, angry.s)} после очередной ссоры {ушёл/ушла} наверх раньше срока. Больше {его} не видели.`, angry.sex)); }
    }
    const defFail = results.find(r => r.need === 'defense' && !r.ok);
    if (defFail) { const v = profs.filter(p => !dead.has(p.s)); if (v.length) { const x = v[Math.floor(R() * v.length)]; st.marks[x.s] = st.marks[x.s] || []; x.mul *= 0.7; deadLines.push(G(`${who(st, x.s)} ранили при налёте.`, x.sex)); } }
  }
  /* life lines */
  const lives = al.map(s => {
    const c = st.chars[s], sex = c.bio.sex;
    let t = c.habit.l ? G(c.habit.l, sex) : G('Жил{а} тихо и никому не мешал{а}.', sex);
    if ((st.marks[s] || []).includes('Вши')) t += ' Вшей так и не вывели.';
    return { s, text: t };
  });
  /* act 2 — outside */
  const cat = CATS[st.cat];
  const fates = [];
  let settled = 0;
  if (!critFail) {
    const groupMed = profs.some(p => (p.sk.med || 0) * p.mul >= 2) ? 0.06 : 0;
    const groupLead = profs.some(p => (p.sk.order || 0) * p.mul >= 2) ? 0.04 : 0;
    profs.filter(p => !dead.has(p.s)).forEach(p => {
      let score = 0.6;
      Object.entries(cat.good).forEach(([t, w]) => { const v = Math.max(0, p.sk[t] || 0); if (v > 0) score += w * Math.min(v, 3) / 3; });
      Object.entries(cat.bad).forEach(([t, w]) => { const v = Math.max(0, p.sk[t] || 0); if (v > 0) score -= w * Math.min(v, 2); });
      score += (p.mul - 1) * 1.2;
      let pr = clamp(0.3 + 0.22 * score + groupMed + groupLead + luck, 0.04, 0.95);
      if (early) pr *= 0.55;
      let special = '';
      if (cat.id === 'sun' && p.sk.sun) { pr = 0; special = G(`${who(st, p.s)} с аллергией на солнце остал{ся/ась} в бункере. Навсегда.`, p.sex); }
      if (cat.id === 'sleep' && p.sk.old) pr = 0;
      if (cat.id === 'flood' && p.sk.waterfear) pr *= 0.3;
      if (cat.id === 'animals' && p.sk.dogs) pr *= 0.3;
      if (cat.id === 'mushroom' && p.sk.mushroom) pr *= 0.3;
      if (cat.id === 'insects' && p.sk.insectfear) pr *= 0.3;
      if (cat.id === 'gravity' && p.sk.height) pr *= 0.3;
      if (cat.id === 'aliens' && p.sk.healthy && !p.sk.weird) pr *= 0.4;
      const ok = R() < pr;
      if (ok) settled++;
      fates.push({ s: p.s, ok, text: special || G((ok ? cat.ok : cat.fail).replace('{w}', who(st, p.s)), p.sex) });
    });
  }
  /* future */
  const surv = profs.filter(p => !dead.has(p.s));
  const preg = surv.find(p => p.bio.preg);
  const fem = surv.filter(p => p.sex === 'f' && p.age <= 44 && p.bio.orient !== 'gay' && p.bio.orient !== 'ace' && !p.sk.infertile);
  const mal = surv.filter(p => p.sex === 'm' && p.age <= 60 && p.bio.orient !== 'gay' && p.bio.orient !== 'ace' && !p.sk.infertile);
  let future;
  if (critFail) future = null;
  else if (preg) { const med = surv.some(p => (p.sk.med || 0) >= 1.5); future = { ok: true, text: `${who(st, preg.s)} родила через ${10 - preg.bio.preg} ${plural(10 - preg.bio.preg, 'месяц', 'месяца', 'месяцев')}.` + (med ? ' Роды приняли как надо.' : ' Без врача роды прошли тяжело, но обошлось.') }; }
  else if (fem.length && mal.length) future = { ok: true, text: 'Через год в бункере родился первый ребёнок.' };
  else future = { ok: null, text: 'Детей в бункере так и не появилось. Выйдете вы той же компанией.' };
  if (future) threats.push({ name: 'Будущее', ok: future.ok, text: future.text });
  /* verdict */
  const need = Math.max(1, Math.ceil(surv.length / 2));
  const win = al.length > 0 && !critFail && settled >= need;
  let epi;
  if (!al.length) epi = 'Выгнали всех. Бункер простоял пустым.';
  else if (critFail) epi = threats.find(t => t.need === critFail.need).text.split('.')[0] + '. Бункер стал братской могилой.';
  else if (!settled) epi = early ? 'Пришлось выйти раньше срока. Наверху не выжил никто.' : 'Бункер вы пережили. А вот то, что наверху, — нет.';
  else if (!win) epi = (early ? 'Пришлось выйти раньше срока. ' : '') + `Наверху ${plural(settled, 'устроился', 'устроились', 'устроились')} только ${settled} из ${surv.length}. Для новой жизни этого мало.`;
  else epi = (early ? 'Пришлось открыть гермодверь раньше срока. ' : `Через ${yearsText(b.years)} вы открыли гермодверь. `) + `Наверху ${plural(settled, 'устроился', 'устроились', 'устроились')} ${settled} из ${surv.length}.`;
  if (early) deadLines.unshift(G(`Из-за этого пришлось выходить наружу раньше срока, неготовыми.`, 'm'));
  return { win, threats, lives, deadLines, fates, epi, cat: cat.name, condLines, survivors: al };
}

/* ===== NETWORK =====
   Host-authoritative: the creator's phone owns the game state.
   Clients send intents, host applies them and publishes the full state. */
const FIREBASE_URL = 'https://shelter-bogdan-default-rtdb.europe-west1.firebasedatabase.app'; // ← сюда вставляется адрес базы Firebase, например https://shelter-xxxx-default-rtdb.europe-west1.firebasedatabase.app

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

class LocalNet {           /* demo: everything in this tab */
  constructor() { this.kind = 'demo'; }
  host(code, state, onIntent) { this.onIntent = onIntent; this.cb && this.cb(state); return Promise.resolve(); }
  join() { return Promise.reject(new Error('demo')); }
  onState(cb) { this.cb = cb; }
  publish(state) { const s = JSON.parse(JSON.stringify(state)); setTimeout(() => this.cb && this.cb(s), 0); }
  send(intent) { setTimeout(() => this.onIntent && this.onIntent({ ...intent, id: uid() }), 0); }
  close() {}
}

class BCNet {              /* testing in several tabs on one device */
  constructor() { this.kind = 'local'; }
  _open(code) { this.ch = new BroadcastChannel('shelter-' + code); this.ch.onmessage = e => this._msg(e.data); }
  host(code, state, onIntent) { this._open(code); this.isHost = true; this.onIntent = onIntent; this.state = state; return Promise.resolve(); }
  join(code) {
    this._open(code); this.isHost = false;
    return new Promise((res, rej) => {
      this._wait = s => { res(s); };
      this.ch.postMessage({ t: 'hello' });
      setTimeout(() => { if (this._wait) { this._wait = null; rej(new Error('notfound')); } }, 1500);
    });
  }
  _msg(m) {
    if (this.isHost) {
      if (m.t === 'hello') this.ch.postMessage({ t: 'state', s: this.state });
      if (m.t === 'intent') this.onIntent && this.onIntent(m.i);
    } else if (m.t === 'state') {
      if (this._wait) { const w = this._wait; this._wait = null; w(m.s); }
      this.cb && this.cb(m.s);
    }
  }
  onState(cb) { this.cb = cb; }
  publish(state) { this.state = state; this.ch.postMessage({ t: 'state', s: state }); this.cb && this.cb(JSON.parse(JSON.stringify(state))); }
  send(intent) { const i = { ...intent, id: uid() }; if (this.isHost) this.onIntent(i); else this.ch.postMessage({ t: 'intent', i }); }
  close() { try { this.ch.close(); } catch (_) {} }
}

class FBNet {              /* real multiplayer through Firebase Realtime Database (REST + streaming) */
  constructor(base) { this.kind = 'online'; this.base = base.replace(/\/$/, ''); }
  _url(path) { return `${this.base}/games/${this.code}/${path}.json`; }
  host(code, state, onIntent) {
    this.code = code; this.isHost = true; this.onIntent = onIntent;
    this.publish(state);
    this.es = new EventSource(this._url('intents'));
    const handle = (key, val) => {
      if (!val || typeof val !== 'object') return;
      this.onIntent(val);
      fetch(this._url('intents/' + key), { method: 'DELETE' }).catch(() => {});
    };
    this.es.addEventListener('put', e => {
      const { path, data } = JSON.parse(e.data);
      if (path === '/') { if (data) Object.entries(data).forEach(([k, v]) => handle(k, v)); }
      else handle(path.slice(1), data);
    });
    this.es.onerror = () => { this.onError && this.onError(); };
    return Promise.resolve();
  }
  join(code) {
    this.code = code; this.isHost = false;
    return fetch(this._url('state')).then(r => r.json()).then(s => {
      if (!s || !s.code) throw new Error('notfound');
      this.es = new EventSource(this._url('state'));
      this.es.addEventListener('put', e => { const { path, data } = JSON.parse(e.data); if (path === '/' && data) this.cb && this.cb(data); });
      this.es.onerror = () => { this.onError && this.onError(); };
      return s;
    });
  }
  resume(code) { return this.join(code); }
  onState(cb) { this.cb = cb; }
  publish(state) {
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      fetch(this._url('state'), { method: 'PUT', body: JSON.stringify(state) }).catch(() => { this.onError && this.onError(); });
    }, 40);
    if (this.isHost && this.cb) { const s = JSON.parse(JSON.stringify(state)); setTimeout(() => this.cb(s), 0); }
  }
  send(intent) {
    const i = { ...intent, id: uid() };
    if (this.isHost) { this.onIntent(i); return; }
    fetch(this._url('intents'), { method: 'POST', body: JSON.stringify(i) }).catch(() => { this.onError && this.onError(); });
  }
  close() { try { this.es && this.es.close(); } catch (_) {} }
}

function makeNet() {
  if (location.hash === '#local') return new BCNet();

  return new LocalNet();

const IMMUNE = store.get('shelter-immune', '0') === '1';

let NET = null, ST = null, HS = null, BOT_T = null;

const esc = t => String(t || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const nameOf = s => { const p = ST && ST.players[s]; return p ? (p.bot ? 'бот' : esc(p.name || '')) : ''; };

const QUEUE = [];

/* ---------- sound ---------- */
const SND = { ctx: null, on: store.get('shelter-sound', '1') === '1' };
function audioUnlock() {
  if (!SND.ctx) { try { SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume();
}
document.addEventListener('pointerdown', audioUnlock, { passive: true });
function tone(t, f, dur, type = 'sine', vol = 0.3) {
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
}
function ding() {
  if (!SND.on || !SND.ctx) return;
  const t = SND.ctx.currentTime;
  [[0, 1318.5], [0.17, 1568]].forEach(([d, f]) => { tone(t + d, f, 1.1, 'sine', 0.28); tone(t + d, f * 2.76, 0.5, 'triangle', 0.05); tone(t + d, f * 0.5, 0.6, 'sine', 0.06); });
}
function rustle(dur = 0.9) {
  if (!SND.on || !SND.ctx) return;
  const c = SND.ctx, t = c.currentTime, len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) { const env = Math.sin(Math.PI * i / len); d[i] = (Math.random() * 2 - 1) * env * (Math.random() < 0.08 ? 1 : 0.25); }
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.7;
  const g = c.createGain(); g.gain.value = 0.35;
  src.connect(bp).connect(g).connect(c.destination); src.start(t + 0.25);
}
function thud() { if (SND.on && SND.ctx) { const t = SND.ctx.currentTime; tone(t, 110, 0.25, 'sine', 0.4); tone(t, 60, 0.3, 'sine', 0.3); } }
function noiseBurst(dur, f1, f2, q, vol, delay = 0) {
  const c = SND.ctx, t = c.currentTime + delay, len = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
  bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp).connect(g).connect(c.destination); src.start(t); src.stop(t + dur + 0.05);
}
/* soft paper flick when someone opens a card */
function tick() { if (SND.on && SND.ctx && !document.querySelector('.intro')) noiseBurst(0.09, 2400, 1600, 2.5, 0.12); }
/* whoosh between intro frames */
function swoosh() { if (SND.on && SND.ctx) noiseBurst(0.7, 350, 2800, 1.1, 0.22); }
/* cinematic «бррааам» tuned for phone speakers: mid-range chord with a slow swell, no sub-bass */
function boom() {
  if (!SND.on || !SND.ctx) return;
  const c = SND.ctx, t = c.currentTime;
  const master = c.createGain(); master.gain.value = 0.5; master.connect(c.destination);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(600, t + 2.6); lp.connect(master);
  [196, 293.66, 392, 587.33].forEach((f, i) => {
    [-7, 7].forEach(det => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
      const v = [0.16, 0.12, 0.09, 0.05][i];
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.18); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
      o.connect(g).connect(lp); o.start(t); o.stop(t + 3);
    });
  });
  noiseBurst(0.5, 900, 300, 0.8, 0.3);
}

/* ---------- toasts & modals ---------- */
function toast(html, ms = 3600) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = html;
  toasts.appendChild(t);
  while (toasts.children.length > (UI.screen === 'game' ? 1 : 2)) toasts.firstChild.remove();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
}
let MODAL = null, MODAL_CLOSE = null, MODAL_LOCK = false;
const busy = () => !!MODAL || !!$('.ev-wrap') || !!$('.intro');
function openModal(html, cls = '', onMount, onClose, locked) {
  closeModal();
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${locked ? '' : '<span class="grab" aria-hidden="true"></span>'}${html}</div>`;
  layer.appendChild(w);
  MODAL = w; MODAL_CLOSE = onClose || null; MODAL_LOCK = !!locked;
  if (!locked) attachSheetDrag(w);
  if (onMount) onMount(w);
}
function closeModal(run) {
  const fn = MODAL_CLOSE; MODAL_CLOSE = null;
  if (MODAL) { MODAL.remove(); MODAL = null; }
  MODAL_LOCK = false;
  if (run && fn) fn();
  setTimeout(nextQueued, 60);
}
function queueModal(fn) { QUEUE.push(fn); if (!busy()) nextQueued(); }
function nextQueued() { if (busy()) return; const fn = QUEUE.shift(); if (fn) fn(); else checkPending(); }
function attachSheetDrag(w) {
  const m = w.querySelector('.modal');
  let y0 = null, x0 = 0, drag = false, dy = 0, t0 = 0;
  w.addEventListener('click', e => { if (e.target === w) closeModal(true); });
  m.addEventListener('touchstart', e => {
    if (e.target.closest('canvas')) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; drag = false; dy = 0; t0 = performance.now();
  }, { passive: true });
  m.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const ddy = e.touches[0].clientY - y0, ddx = e.touches[0].clientX - x0;
    if (!drag) {
      if (ddy > 8 && ddy > Math.abs(ddx) && m.scrollTop <= 0) { drag = true; m.classList.add('dragging'); }
      else if (Math.abs(ddy) > 8 || Math.abs(ddx) > 8) { y0 = null; return; }
    }
    if (drag) { e.preventDefault(); dy = Math.max(0, ddy); m.style.transform = `translateY(${dy}px)`; w.style.opacity = String(Math.max(.35, 1 - dy / 600)); }
  }, { passive: false });
  const end = () => {
    if (drag) {
      const v = dy / Math.max(1, performance.now() - t0);
      m.classList.remove('dragging');
      if (dy > 110 || v > 0.6) { m.style.transform = 'translateY(120%)'; w.style.opacity = '0'; setTimeout(() => { if (MODAL === w) closeModal(true); }, 200); }
      else { m.style.transform = ''; w.style.opacity = ''; }
    }
    y0 = null; drag = false;
  };
  m.addEventListener('touchend', end); m.addEventListener('touchcancel', end);
}

/* ---------- host ---------- */
function hostCreate() {
  const code = randCode();
  HS = newGame(code, UI.count, { absurd: UI.absurd });
  NET = makeNet(); NET.onState(onState);
  ME.host = true; ME.code = code; ME.seat = 0;
  NET.host(code, HS, onIntent);
  pub();
  saveResume();
}
function pub() {
  HS.seen = (HS.seen || []).slice(-300);
  NET.publish(HS);
  if (NET.kind !== 'demo') store.set('shelter-host-' + HS.code, JSON.stringify(HS));
  ensureBots();
}
function onIntent(it) {
  if (!HS || (HS.seen || []).includes(it.id)) return;
  HS.seen.push(it.id);
  const st = HS;
  switch (it.type) {
    case 'join': {
      if (st.phase !== 'lobby') break;
      const p = st.players[it.seat];
      if (p && p.dev !== it.dev && !p.bot) break;
      Object.keys(st.players).forEach(k => { if (st.players[k].dev === it.dev) delete st.players[k]; });
      st.players[it.seat] = { joined: true, dev: it.dev, immune: !!it.immune, name: String(it.name || '').slice(0, 14) };
      break;
    }
    case 'bots': for (let s = 1; s <= st.n; s++) if (!st.players[s]) st.players[s] = { joined: true, bot: true }; break;
    case 'start': if (st.phase === 'lobby' && Object.keys(st.players).length >= 2) startGame(st); break;
    case 'reveal': if (st.phase === 'play' && st.chars[it.seat] && TRAITS.includes(it.cat)) revealCat(st, it.seat, it.cat); break;
    case 'kick': if (st.phase === 'play') doKick(st, it.seat); break;
    case 'unkick': if (st.phase === 'play' && st.kicked.includes(it.seat)) { st.kicked = st.kicked.filter(x => x !== it.seat); delete st.pending[it.seat]; say(st, `№${it.seat} возвращён в игру.`); } break;
    case 'play': if (st.phase === 'play') applyAction(st, it.seat, it); break;
    case 'choose': if (st.pending[it.seat]) resolvePending(st, it.seat, it); break;
    case 'condReveal': { st.condRev[it.seat] = true; const c = condOf(st, it.seat); say(st, `№${it.seat} раскрывает «${c.n}»: ${c.d}`); break; }
    case 'round': if (st.phase === 'play') startRound(st); break;
    case 'sortie': resolveSortie(st, it.target); break;
    case 'finale': if (st.phase === 'play') { st.ending = computeEnding(st); st.phase = 'end'; } break;
  }
  pub();
}
function ensureBots() {
  const hasBots = HS && Object.values(HS.players).some(p => p.bot);
  if (hasBots && !BOT_T) BOT_T = setTimeout(botTick, 3000);
}
function botTick() {
  BOT_T = null;
  if (!HS || HS.phase !== 'play') { ensureBots(); return; }
  const st = HS;
  const bots = alive(st).filter(s => st.players[s] && st.players[s].bot);
  let changed = false;
  Object.keys(st.pending).map(Number).forEach(s => {
    if (!st.players[s] || !st.players[s].bot) return;
    const others = alive(st).filter(x => x !== s);
    if (others.length) { resolvePending(st, s, { target: pick(others), cat: 'bag' }); changed = true; }
  });
  if (!busyHostOnly()) {
    const quota = st.table.slice(0, st.round).reduce((a, r) => a + r.open, 0);
    const cands = bots.filter(s => st.rev[s].length < quota);
    if (cands.length) { const s = pick(cands); const h = TRAITS.filter(k => !st.rev[s].includes(k)); if (h.length) { revealCat(st, s, pick(h)); changed = true; } }
    if (Math.random() < 0.12) {
      const s = pick(bots.filter(x => !st.actUsed[x]) || []);
      if (s) {
        const a = ACTIONS[st.chars[s].act];
        if (a && a.t <= 2) {
          const others = alive(st).filter(x => x !== s), kicked = st.kicked;
          const it = { target: pick(others), target2: pick(others.filter(x => x !== others[0])) || others[0], cat: pick(TRAITS) };
          if (a.tg === 'two') { const sh = shuffle(others); it.target = sh[0]; it.target2 = sh[1]; }
          if (a.tg.startsWith('kicked')) it.target = kicked.length ? pick(kicked) : 0;
          if ((a.tg !== 'two' || others.length >= 2) && (!a.tg.startsWith('kicked') || kicked.length) && (a.tg === 'none' || it.target)) { applyAction(st, s, it); changed = true; }
        }
      }
    }
  }
  if (changed) pub();
  BOT_T = setTimeout(botTick, 2800 + Math.random() * 2600);
}
function busyHostOnly() { return HS && HS.event && HS.event.sortie && !HS.event.sortie.chosen; }

/* ---------- client ---------- */
function joinGame(code) {
  ME.host = false; ME.code = code; ME.seat = 0;
  NET = makeNet(); NET.onState(onState);
  NET.join(code).then(st => {
    ME.host = false; ME.code = code; ME.seat = 0;
    onState(st); saveResume();
  }).catch(() => { toast('<b>Бункер не найден</b>Проверь код и интернет.'); NET.close(); NET = null; });
}
function send(intent) { if (NET) NET.send(intent); }
function saveResume() { if (NET && NET.kind !== 'demo') store.set('shelter-resume', JSON.stringify({ code: ME.code, seat: ME.seat, host: ME.host })); }
function leaveGame() {
  if (NET) NET.close();
  NET = null; ST = null; HS = null; clearTimeout(BOT_T); BOT_T = null;
  ME.seat = 0; ME.host = false; ME.code = '';
  SEEN.toast = 0; SEEN.ev = 0; SEEN.evR = 0; SEEN.intro = 0; SEEN.ending = false; SEEN.priv.clear();
  slideSig = {}; prevRev = {}; QUEUE.length = 0;
  store.del('shelter-resume');
  closeModal(); const ev = $('.ev-wrap'); if (ev) ev.remove(); const intro = $('.intro'); if (intro) intro.remove();
  go('menu');
}
function resume() {
  const r = JSON.parse(store.get('shelter-resume', 'null') || 'null');
  if (!r) return;
  ME.code = r.code; ME.seat = r.seat; ME.host = r.host;
  if (r.host) {
    const saved = store.get('shelter-host-' + r.code, '');
    if (!saved) { toast('<b>Не вышло</b>Игра не сохранилась на этом телефоне.'); store.del('shelter-resume'); go('menu'); return; }
    HS = JSON.parse(saved); NET = makeNet(); NET.onState(onState); NET.host(r.code, HS, onIntent); SEEN.intro = HS.introSeq || 0; pub();
  } else {
    NET = makeNet(); NET.onState(onState);
    NET.join(r.code).then(st => { SEEN.intro = st.introSeq || 0; onState(st); }).catch(() => { toast('<b>Бункер не найден</b>Возможно, игра уже закончилась.'); store.del('shelter-resume'); go('menu'); });
  }
}

function onState(st) {
  const prev = ST; ST = st;
  if (ME.seat && !st.players[ME.seat]) ME.seat = 0;
  if (!ME.seat) { const mine = Object.keys(st.players).find(k => st.players[k].dev === DEV); if (mine) { ME.seat = +mine; saveResume(); } }
  if (st.toast && st.toast.seq !== SEEN.toast) { const fresh = !!prev; SEEN.toast = st.toast.seq; if (fresh && st.phase !== 'lobby') toast(st.toast.text); }
  if (st.phase === 'lobby') {
    if (!ME.seat) { if (UI.screen !== 'code') go('code'); else refreshWheelTaken(); }
    else if (UI.screen !== 'lobby') go('lobby'); else go('lobby');
    return;
  }
  if (UI.screen !== 'game' || !prev || prev.phase === 'lobby' || (prev.active || []).join() !== (st.active || []).join()) {

  return `<div class="catgrid">${ks.map(k => `<button data-act="${act}" data-k="${k}" class="${sel === k ? 'sel' : ''}">${art(k)}${LABELS[k]}</button>`).join('')}</div>`;
}
const PLAY = {};
function openPlay() {
  const A = ACTIONS[ST.chars[ME.seat].act];
  PLAY.a = A; PLAY.t = 0; PLAY.t2 = 0; PLAY.cat = '';
  renderPlay();
}
function renderPlay() {
  const A = PLAY.a, me = ME.seat;
  const others = alive(ST).filter(s => s !== me), kicked = ST.kicked.filter(s => s !== me);
  let body = '', ready = false;
  if (A.tg === 'none') ready = true;
  if (A.tg === 'one') { body = `<p class="step">На кого?</p>${others.length ? playersPicker(others, 'pT', [PLAY.t]) : '<p class="hint">Не на кого сыграть.</p>'}`; ready = !!PLAY.t; }
  if (A.tg === 'two') { body = `<p class="step">Выбери двух игроков</p>${others.length >= 2 ? playersPicker(others, 'pT2', [PLAY.t, PLAY.t2]) : '<p class="hint">Нужно хотя бы двое других.</p>'}`; ready = !!(PLAY.t && PLAY.t2); }
  if (A.tg === 'kicked') { body = `<p class="step">Кого из выгнанных?</p>${kicked.length ? playersPicker(kicked, 'pT', [PLAY.t]) : '<p class="hint">Пока никого не выгнали.</p>'}`; ready = !!PLAY.t; }
  if (A.tg === 'one+cat' || A.tg === 'kicked+cat') {
    const list = A.tg === 'one+cat' ? others : kicked;
    body = `<p class="step">${A.tg === 'one+cat' ? 'На кого?' : 'Кого из выгнанных?'}</p>${list.length ? playersPicker(list, 'pT', [PLAY.t]) : '<p class="hint">Не на кого сыграть.</p>'}`;
    if (PLAY.t) body += `<p class="step">Какую карту?</p>${catPicker(PLAY.t, 'pCat', A.tg === 'one+cat', PLAY.cat)}`;
    ready = !!(PLAY.t && PLAY.cat);
  }
  const tierName = ['', 'мелкая', 'средняя', 'сильная', 'имба'][A.t];
  openModal(`<h3 class="m-title">Сыграть карту</h3>
    <div class="acard">${art('act')}<div><b>${A.n}<span class="tier">${tierName}</span></b><span>${A.d}</span></div></div>
    ${body}
    <button class="btn btn-primary btn-block" data-act="pGo" ${ready ? '' : 'disabled'}>Сыграть</button>
    <button class="btn btn-block" data-act="closeModal">Отмена</button>`);
}
function openPending() {
  const p = ST.pending[ME.seat], K = CONDS[ST.chars[ME.seat].cond];
  PLAY.pt = PLAY.pt || 0; PLAY.pc = PLAY.pc || 'bag';
  const others = alive(ST).filter(s => s !== ME.seat);
  const needCat = p.type === 'farewell';
  const titles = { redirectFirst: 'Кого выгнать вместо тебя?', revenge: 'Кто откроет все карты?', inherit: 'Кому достанется твой багаж?', farewell: 'Кому оставить карту?', expose2: 'Кто откроет две карты?', witness: 'Чьи карты посмотреть?' };
  openModal(`<h3 class="m-title">Сработала карта условия</h3>
    <div class="acard" style="background:var(--t-know)">${art('cond')}<div><b>${K.n}</b><span>${K.d}</span></div></div>
    <p class="step">${titles[p.type]}</p>${playersPicker(others, 'pendT', [PLAY.pt])}
    ${needCat ? `<p class="step">Какую карту?</p>${catPicker(ME.seat, 'pendC', false, PLAY.pc)}` : ''}
    <button class="btn btn-primary btn-block" data-act="pendGo" ${PLAY.pt ? '' : 'disabled'}>Готово</button>`, '', null, null, true);
}
function openEnding() {
  const E = ST.ending; if (!E) return;
  const mk = ok => ok === true ? ['ok', art('check')] : ok === false ? ['bad', art('cross')] : ['mid', art('dash')];
  const body = `
    <div class="verdict ${E.win ? 'ok' : 'bad'}"><span>${E.win ? 'ВЫЖИЛИ' : 'ПОГИБЛИ'}</span></div>
    <div class="end-sec">В бункере</div>
    ${E.threats.map(t => { const [c, ic] = mk(t.ok); return `<div class="tline ${c}">${ic}<div><b>${t.name}</b>${t.text}</div></div>`; }).join('')}
    ${E.deadLines.length ? `<div class="sub">Потери</div>${E.deadLines.map(l => `<div class="dline">${l}</div>`).join('')}` : ''}
    ${E.lives.length ? `<div class="sub">Кто что делал</div>${E.lives.map(l => `<div class="lline"><b>№${l.s} ${G(ST.chars[l.s].prof.t, ST.chars[l.s].bio.sex)}.</b> ${l.text}</div>`).join('')}` : ''}
    ${E.fates.length ? `<div class="end-sec">Наружу</div>${E.fates.map(f => `<div class="fline ${f.ok ? 'ok' : 'bad'}">${art(f.ok ? 'check' : 'cross')}<div>${f.text}</div></div>`).join('')}` : ''}
    ${E.condLines.length ? `<div class="sub">Сработали карты условия</div><p class="m-text">${E.condLines.join(', ')}</p>` : ''}
    <p class="epi">${E.epi}</p>`;
  openModal(`<h3 class="m-title">Финал</h3>
    <div class="sub">Выжившие</div>
    <div class="surv">${E.survivors.length ? E.survivors.map(s => `<span>№${s} ${G(ST.chars[s].prof.t, ST.chars[s].bio.sex)}${nameOf(s) ? ` (${nameOf(s)})` : ''}</span>`).join('') : '<span>никого</span>'}</div>
    <div class="act" id="act"><div class="act-body">${body}</div><canvas class="scratch" id="scratch" aria-label="Сотри слой, чтобы открыть концовку"></canvas></div>
    <button class="linkish" data-act="unscratch">Показать без стирания</button>
    <button class="btn btn-block" data-act="closeModal">Закрыть</button>`, '', mountScratch);
}
function mountScratch(w) {
  const cv = $('#scratch', w), box = $('#act', w);
  requestAnimationFrame(() => {
    const r = box.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d'), cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
    ctx.fillStyle = col('--ic-yellow'); ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = col('--line'); ctx.globalAlpha = .9; ctx.lineWidth = 14 * dpr;
    for (let x = -H; x < W; x += 44 * dpr) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const ty = Math.min(H / 2, 120 * dpr);
    ctx.fillStyle = col('--ic-white'); ctx.strokeStyle = col('--line'); ctx.lineWidth = 3 * dpr;
    const bw = 230 * dpr, bh = 74 * dpr;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(W / 2 - bw / 2, ty - bh / 2, bw, bh, 14 * dpr); else ctx.rect(W / 2 - bw / 2, ty - bh / 2, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = col('--ink'); ctx.textAlign = 'center';
    ctx.font = `700 ${28 * dpr}px "PT Sans Narrow", "Arial Narrow", sans-serif`; ctx.fillText('Сотри пальцем', W / 2, ty - 2 * dpr);
    ctx.font = `500 ${14 * dpr}px Rubik, sans-serif`; ctx.fillText('под слоем ваша судьба', W / 2, ty + 20 * dpr);
    const CELL = 18, gw = Math.ceil(r.width / CELL), gh = Math.ceil(r.height / CELL), grid = new Uint8Array(gw * gh);
    let covered = 0, drawing = false, lx = 0, ly = 0;
    const RAD = 46;
    let started = false;
    const markCells = (x, y) => {
      const x0 = Math.max(0, Math.floor((x - RAD) / CELL)), x1 = Math.min(gw - 1, Math.floor((x + RAD) / CELL));
      const y0 = Math.max(0, Math.floor((y - RAD) / CELL)), y1 = Math.min(gh - 1, Math.floor((y + RAD) / CELL));
      for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) { const i = gy * gw + gx; if (!grid[i]) { grid[i] = 1; covered++; } }
    };
    const pos = e => { const bb = cv.getBoundingClientRect(); return [e.clientX - bb.left, e.clientY - bb.top]; };
    const scratchTo = (x, y) => {
      ctx.globalCompositeOperation = 'destination-out'; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = RAD * 2 * dpr;
      ctx.beginPath(); ctx.moveTo(lx * dpr, ly * dpr); ctx.lineTo(x * dpr, y * dpr); ctx.stroke();
      const steps = Math.max(1, Math.ceil(Math.hypot(x - lx, y - ly) / 8));
      for (let i = 1; i <= steps; i++) markCells(lx + (x - lx) * i / steps, ly + (y - ly) * i / steps);
      lx = x; ly = y;
      if (covered / (gw * gh) > 0.3 && !cv.classList.contains('gone')) { cv.classList.add('gone'); thud(); }
    };
    cv.addEventListener('pointerdown', e => { if (!started) { started = true; setTimeout(() => { if (!cv.classList.contains('gone')) { cv.classList.add('fading'); setTimeout(() => { cv.classList.add('gone'); thud(); }, 1500); } }, 1300); } drawing = true; [lx, ly] = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} scratchTo(lx + .1, ly + .1); if (SND.on) rustle(0.3); });
    cv.addEventListener('pointermove', e => { if (drawing) { const [x, y] = pos(e); scratchTo(x, y); } });
    ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { drawing = false; }));
  });
}
function openHowto() {
  openModal(`<h3 class="m-title">Как играть</h3>
    <ol class="rules">
      <li>Создатель жмёт «Создать» и называет код. Остальные вводят его в «Подключиться» и выбирают номер.</li>
      <li>Перед игрой всем показывают, какая случилась катастрофа и что за бункер вам достался.</li>
      <li>Каждый раунд открываете карты: удерживай свою, и она откроется у всех.</li>
      <li>В начале раунда приходит радиограмма с событием. Карты действия играются в любой момент, карты условия срабатывают сами.</li>
      <li>Голосуете вслух и жмёте «Выгнать» на карте игрока. Когда людей станет столько, сколько мест, жмите «Финал» и стирайте концовку.</li>
    </ol>
    <button class="btn btn-primary btn-block" data-act="closeModal">Понятно</button>`);
}

/* ---------- clicks ---------- */
function handle(act, el, e) {
  switch (act) {
    case 'join':
      if (!ONLINE()) { toast('<b>Пока только демо</b>Онлайн заработает, когда игра будет на своём сайте. Жми «Создать», чтобы сыграть с ботами.', 5000); break; }
      go('join'); break;
    case 'create': go('create'); break;
    case 'toMenu': go('menu'); break;
    case 'howto': openHowto(); break;
    case 'resume': resume(); break;
    case 'dec': case 'inc': UI.count = clamp(UI.count + (act === 'inc' ? 1 : -1), 4, 16); $('#count').textContent = UI.count; $('#range').value = UI.count; break;
    case 'set':
      if (el.dataset.k === 'absurd') { UI.absurd = !UI.absurd; go('create'); }
      else if (el.dataset.k === 'school') toast('<b>Скоро</b>Школьный набор появится в следующей колоде.');
      else toast('<b>Обычный набор</b>Это основа игры, его не выключить.');
      break;
    case 'hostCreate': hostCreate(); break;
    case 'share': {
      const text = `Заходи в бункер: код ${ME.code}`;
      if (navigator.share) navigator.share({ title: 'Shelter by Bulatnikov', text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(ME.code).then(() => toast('<b>Скопировано</b>Код в буфере обмена.')).catch(() => toast(`<b>Код</b>${ME.code}`));
      break;
    }
    case 'paste':
      if (navigator.clipboard && navigator.clipboard.readText) navigator.clipboard.readText().then(t => { const L = (t || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3); document.querySelectorAll('.ci').forEach((x, i) => { x.value = L[i] || ''; }); }).catch(() => toast('<b>Не вышло вставить</b>Введи код вручную.'));
      break;
    case 'joinNext': { const v = [...document.querySelectorAll('.ci')].map(i => i.value).join(''); if (v.length < 3) { toast('<b>Нужен код</b>Введи три буквы.'); break; } joinGame(v); break; }
    case 'takeSeat': {
      if (takenSeats().includes(UI.wheelIdx)) break;
      const nm = ($('#nameIn').value || '').trim().slice(0, 14);
      if (!nm) { toast('<b>Напиши имя</b>Так все увидят, кто за каким номером.'); $('#nameIn').focus(); break; }
      store.set('shelter-name', nm);
      send({ type: 'join', seat: UI.wheelIdx, dev: DEV, immune: IMMUNE, name: nm }); break;
    }
    case 'lobbySeat': {
      const s = +el.dataset.s, p = ST.players[s];
      if (s === ME.seat) break;
      if (p) { toast(`<b>№${s} занят</b>${p.bot ? 'Там бот.' : esc(p.name || 'Там уже кто-то сидит.')}`); break; }
      send({ type: 'join', seat: s, dev: DEV, immune: IMMUNE, name: store.get('shelter-name', '') }); break;
    }
    case 'bots': send({ type: 'bots' }); break;
    case 'start': send({ type: 'start' }); break;
    case 'leaveGame': leaveGame(); break;
    case 'view': goToSeat(+el.dataset.s); break;
    case 'kick': send({ type: 'kick', seat: +el.dataset.s }); break;
    case 'unkick': send({ type: 'unkick', seat: +el.dataset.s }); break;
    case 'locked': el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); break;
    case 'hint': e.stopPropagation(); el.closest('.crow').classList.toggle('show-hint'); break;
    case 'playAct': openPlay(); break;
    case 'pT': PLAY.t = +el.dataset.s; PLAY.cat = ''; renderPlay(); break;
    case 'pT2': { const s = +el.dataset.s; if (PLAY.t === s) PLAY.t = 0; else if (PLAY.t2 === s) PLAY.t2 = 0; else if (!PLAY.t) PLAY.t = s; else PLAY.t2 = s; renderPlay(); break; }
    case 'pCat': PLAY.cat = el.dataset.k; renderPlay(); break;
    case 'pGo': send({ type: 'play', seat: ME.seat, target: PLAY.t, target2: PLAY.t2, cat: PLAY.cat }); closeModal(); break;
    case 'pendT': PLAY.pt = +el.dataset.s; openPending(); break;
    case 'pendC': PLAY.pc = el.dataset.k; openPending(); break;
    case 'pendGo': send({ type: 'choose', seat: ME.seat, target: PLAY.pt, cat: PLAY.pc }); PLAY.pt = 0; PLAY.pc = 'bag'; closeModal(); break;
    case 'condReveal': send({ type: 'condReveal', seat: ME.seat }); break;
    case 'drawer': openDrawer(); break;
    case 'closeDrawer': closeDrawer(); break;
    case 'home': openHome(); break;
    case 'soundToggle': SND.on = !SND.on; store.set('shelter-sound', SND.on ? '1' : '0'); el.classList.toggle('on', SND.on); if (SND.on) { audioUnlock(); ding(); } break;
    case 'rounds': openRounds(); break;
    case 'nextRound': closeModal(); send({ type: 'round' }); break;
    case 'ending':
      if (ST.phase === 'end') { openEnding(); break; }
      {
        const al = alive(ST).length, seats = ST.seatsInBunker + (ST.extraSeats || 0);
        if (al > seats) openModal(`<h3 class="m-title">Финал</h3><p class="m-text">В бункере ${seats} ${plural(seats, 'место', 'места', 'мест')}, а вас ещё ${al}. Выгоните ещё ${al - seats}, и концовка откроется.</p><button class="btn btn-block" data-act="closeModal">Назад к игре</button>`);
        else openModal(`<h3 class="m-title">Закончить игру?</h3><p class="m-text">Концовка откроется у всех сразу. Вернуть выгнанных после этого уже нельзя.</p><button class="btn btn-primary btn-block" data-act="finale">Открыть концовку</button><button class="btn btn-block" data-act="closeModal">Ещё рано</button>`);
      }
      break;
    case 'finale': closeModal(); send({ type: 'finale' }); break;
    case 'unscratch': { const c = $('#scratch'); if (c) c.classList.add('gone'); break; }
    case 'sortiePick': send({ type: 'sortie', target: +el.dataset.s }); { const box = $('#evSortie'); if (box) box.innerHTML = '<p class="hint">Отправляем…</p>'; } break;
    case 'evClose': closeEvent(); break;
    case 'introSkip': endIntro(); break;
    case 'closeModal': closeModal(true); break;
  }
}
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  handle(el.dataset.act, el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (MODAL && !MODAL_LOCK) closeModal(true); else closeDrawer(); } });

go('menu');

</script>
